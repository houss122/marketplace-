<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Marketplace</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f3f4f6;
}

header{
background:#111827;
color:white;
padding:20px;
text-align:center;
}

nav{
display:flex;
justify-content:center;
gap:20px;
background:#1f2937;
padding:10px;
}

nav button{
background:none;
border:none;
color:white;
font-size:16px;
cursor:pointer;
}

.container{
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

input,select{
padding:10px;
width:100%;
margin-bottom:10px;
}

button.publish{
background:#2563eb;
color:white;
border:none;
padding:10px;
border-radius:6px;
cursor:pointer;
}

.chatBox{
border:1px solid #ccc;
padding:10px;
height:200px;
overflow:auto;
background:white;
margin-bottom:10px;
}

.settings{
background:white;
padding:20px;
border-radius:10px;
}

</style>

</head>

<body>

<header>
<h1>🌍 Global Marketplace</h1>
<p>Buy and sell worldwide</p>
</header>

<nav>

<button onclick="showPage('home')">Home</button>
<button onclick="showPage('search')">Search</button>
<button onclick="showPage('sell')">Sell</button>
<button onclick="showPage('chat')">Chat</button>
<button onclick="showPage('settings')">Settings</button>

</nav>

<div class="container">

<div id="home">

<h2>Latest Listings</h2>

<div class="grid" id="items"></div>

</div>

<div id="search" style="display:none">

<h2>Search Items</h2>

<input id="searchInput" placeholder="Search item">

<select id="categoryFilter">

<option value="">All categories</option>
<option>Clothes</option>
<option>Cars</option>
<option>Electronics</option>

</select>

<button onclick="searchItems()">Search</button>

</div>

<div id="sell" style="display:none">

<h2>Sell Item</h2>

<input id="title" placeholder="Title">

<input id="price" placeholder="Price">

<select id="category">

<option>Clothes</option>
<option>Cars</option>
<option>Electronics</option>

</select>

<button class="publish" onclick="publishItem()">Publish</button>

</div>

<div id="chat" style="display:none">

<h2>Messages</h2>

<div class="chatBox" id="messages"></div>

<input id="messageInput" placeholder="Type message">

<button onclick="sendMessage()">Send</button>

</div>

<div id="settings" style="display:none">

<h2>Settings</h2>

<div class="settings">

<p>Language</p>

<select>
<option>English</option>
<option>French</option>
<option>German</option>
</select>

<p>Theme</p>

<select onchange="changeTheme(this.value)">
<option value="light">Light</option>
<option value="dark">Dark</option>
</select>

</div>

</div>

</div>

<script>

let items = []

function showPage(page){

document.querySelectorAll(".container > div")
.forEach(div => div.style.display="none")

document.getElementById(page).style.display="block"

}

function publishItem(){

let title=document.getElementById("title").value
let price=document.getElementById("price").value
let category=document.getElementById("category").value

let item={title,price,category}

items.push(item)

displayItems()

}

function displayItems(){

let container=document.getElementById("items")

container.innerHTML=""

items.forEach(item=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<h3>${item.title}</h3>
<p>Price: ${item.price}</p>
<p>Category: ${item.category}</p>
<button onclick="showPage('chat')">Chat seller</button>

`

container.appendChild(div)

})

}

function searchItems(){

let query=document.getElementById("searchInput").value.toLowerCase()

let filtered=items.filter(item =>
item.title.toLowerCase().includes(query)
)

let container=document.getElementById("items")

container.innerHTML=""

filtered.forEach(item=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<h3>${item.title}</h3>
<p>${item.price}</p>
<p>${item.category}</p>

`

container.appendChild(div)

})

}

function sendMessage(){

let input=document.getElementById("messageInput")

let msg=input.value

let box=document.getElementById("messages")

box.innerHTML += "<p>"+msg+"</p>"

input.value=""

}

function changeTheme(theme){

if(theme==="dark"){

document.body.style.background="#111"
document.body.style.color="white"

}else{

document.body.style.background="#f3f4f6"
document.body.style.color="black"

}

}

displayItems()

</script>

</body>
</html>
